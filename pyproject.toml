[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regagent"
version = "0.1.0"
description = "Regulatory RAG agent for credit risk (PoC) — synthetic IRB portfolio and tooling"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Task 02 — document ingestion + hybrid retrieval.
ingest = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pymupdf>=1.24",
]
retrieval = [
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "data", "scripts"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
